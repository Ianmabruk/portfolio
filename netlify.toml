[build]
  base = "web"
  command = "npm run build"
  publish = "web/dist"

[[redirects]]
  from = "/api/*"
  to = "https://portfolio-backend-jwm1.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"